# Warden Pipeline
#

name: Warden CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test-warden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=. python -m pytest tests/test-registry.py tests/test-state.py -v

  push-warden:
    needs: test-warden
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghrc.io/marshallfungai/warden:latest
            ghrc.io/marshallfungai/warden:${{ github.sha }}
