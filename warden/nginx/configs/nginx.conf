events {}

http{
    include /etc/nginx/mime.types;
    include /etc/nginx/configs/upstream.conf;

    map $active_backend $active_upstream {
        blue $blue_backend_server;
        green $green_backend_server;
    }

    server {
        include /etc/nginx/configs/active_backend.conf;
        listen 80;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        location / {
            proxy_pass http://$active_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}